[package]
name = "petunia_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
petunia_core = { workspace = true }
petunia_mesh = { workspace = true }
petunia_project = { workspace = true }
petunia_config = { workspace = true }
petunia_module_model = { workspace = true }
petunia_module_paint = { workspace = true }
petunia_module_uv = { workspace = true }
petunia_module_assets = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
iconflow = { workspace = true }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
petunia_render = { workspace = true }
glam = { workspace = true }
egui-phosphor = "0.14"
egui-file-dialog = "0.15"
egui_ltreeview = "0.9"
egui_tiles = "0.17"
egui_inbox = { workspace = true }
egui_taffy = { workspace = true }
twill = { workspace = true }
puffin = { workspace = true }
mint = "0.5"
transform-gizmo = "0.11"
transform-gizmo-egui = "0.11"
serde = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
egui_kittest = "0.36.2"

[features]
default = []
# Heavy vector packs (Tabler ~116k + Phosphor ~191k generated lines).
# Off by default: this dev machine (5.4 GiB RAM) cannot compile them
# (rustc SIGKILL/OOM); CI with adequate RAM enables this feature to honor
# the full 4-pack Petunia customization promise.
extended-icon-packs = ["iconflow/pack-tabler", "iconflow/pack-phosphor"]
# In-app help/release-notes Markdown rendering.
help-markdown = ["dep:egui_commonmark"]
# Command-palette completion via dedicated widget.
palette-autocomplete = ["dep:egui_autocomplete"]
# Native key-combination capture in the keymap editor
# (egui_hotkey 0.2 pins egui 0.19: incompatible, see key_capture.rs).
keymap-capture = []
# Unified devtools entry (inspection, agent bridge, probe, profiler).
# Default-off: never ships in distribution builds.
devtools = ["dep:egui_inspection", "dep:egui_mcp", "dep:egui-probe"]

[dependencies.egui_commonmark]
workspace = true
optional = true

[dependencies.egui_autocomplete]
workspace = true
optional = true

[dependencies.egui_inspection]
workspace = true
optional = true

[dependencies.egui_mcp]
workspace = true
optional = true

[dependencies.egui-probe]
workspace = true
optional = true

