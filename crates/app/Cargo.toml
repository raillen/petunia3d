[package]
name = "petunia_app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
petunia_core = { workspace = true }
petunia_mesh = { workspace = true }
petunia_config = { workspace = true }
petunia_project = { workspace = true }
petunia_render = { workspace = true }
petunia_render_gl = { workspace = true }
petunia_render_wgpu = { workspace = true }
petunia_module_model = { workspace = true }
petunia_ui = { workspace = true }
winit = "0.30"
egui = { workspace = true }
egui-winit = { workspace = true, features = ["accesskit"] }
egui-wgpu = { workspace = true }
egui_glow = { workspace = true }
glam = { workspace = true }
pollster = "0.4"
anyhow = { workspace = true }
log = { workspace = true }

petunia_module_paint = { workspace = true }
wgpu = "25"
petunia_module_assets = { workspace = true }
petunia_module_uv = { workspace = true }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
