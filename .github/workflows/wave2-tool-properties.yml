name: modeling-convergence-wave-2

on:
  push:
    branches:
      - ux/modeling-tool-system-convergence
    paths:
      - scripts/apply_wave2_tool_properties.py
      - scripts/run_wave2_tool_properties.py
      - .github/workflows/wave2-tool-properties.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/modeling-tool-system-convergence
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev

      - name: Apply Wave 2 implementation
        run: python3 scripts/run_wave2_tool_properties.py

      - name: Guard legacy modeling UI removal
        run: |
          test ! -f crates/ui/src/modules_ui/model_ui.rs
          ! grep -R "model_ui" -n crates/ui/src --include='*.rs'

      - name: Format
        run: cargo fmt --all

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check Wave 2 crates
        run: cargo check -p petunia_ui -p petunia_app -p petunia_module_model -p petunia_core -p petunia_config

      - name: Clippy Wave 2 crates
        run: cargo clippy -p petunia_ui -p petunia_app -p petunia_module_model -p petunia_core --all-targets -- -D warnings

      - name: Test UI convergence
        run: cargo test -p petunia_ui --lib

      - name: Test core modal lifecycle
        run: cargo test -p petunia_core

      - name: Test modeling module
        run: cargo test -p petunia_module_model

      - name: Test localization/config
        run: cargo test -p petunia_config

      - name: Test app integration
        run: cargo test -p petunia_app --lib

      - name: Remove staging automation
        run: |
          rm -f scripts/apply_wave2_tool_properties.py
          rm -f scripts/run_wave2_tool_properties.py
          rm -f .github/workflows/wave2-tool-properties.yml

      - name: Commit validated Wave 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: converge modeling tool properties and localization [skip ci]"
          git push origin HEAD:ux/modeling-tool-system-convergence
