          cp docs/image-references/extracted/toolbar/buttons/tool_08_measure_40x40.svg assets/ui/icons/toolbar/measure.svg
          cp docs/image-references/extracted/toolbar/buttons/tool_09_add_primitive_40x40.svg assets/ui/icons/toolbar/add_primitive.svg

          cat > assets/icons/petunia/icons.toml <<'TOML'
          [icons]
          select_box = "assets/ui/icons/toolbar/select_box.svg"
          cursor_3d = "assets/ui/icons/toolbar/cursor_3d.svg"
          move = "assets/ui/icons/toolbar/move.svg"
          rotate = "assets/ui/icons/toolbar/rotate.svg"
          scale = "assets/ui/icons/toolbar/scale.svg"
          transform = "assets/ui/icons/toolbar/transform.svg"
          annotate = "assets/ui/icons/toolbar/annotate.svg"
          measure = "assets/ui/icons/toolbar/measure.svg"
          add_primitive = "assets/ui/icons/toolbar/add_primitive.svg"
          TOML

          cargo fmt --all
          rm .github/workflows/modeling-convergence-stack.yml
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check project and core
        run: |
          cargo check -p petunia_project
          cargo check -p petunia_core
      - name: Check renderers
        run: |
          cargo check -p petunia_render_wgpu
          cargo check -p petunia_render_gl
      - name: Check UI and app
        run: |
          cargo check -p petunia_ui
          cargo check -p petunia_app
      - name: Focused tests
        run: |
          cargo test -p petunia_project
          cargo test -p petunia_core --lib
          cargo test -p petunia_ui --lib
      - name: Commit validated stack batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add modifier stack, SVG icons and modeling polish [skip ci]'
          git push origin HEAD:ux/modeling-tool-system-convergence
