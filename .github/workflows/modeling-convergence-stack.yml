    pub fn get_or_load_svg_texture(ctx: &Context, id: &str) -> Option<TextureHandle> {
        let key = format!("svg:{id}");
        if let Ok(cache) = TEXTURE_CACHE.read()
            && let Some(handle) = cache.get(&key)
        {
            return Some(handle.clone());
        }
        let svg = get_embedded_svg_str(id)?;
        let image = decode_svg_to_alpha_mask(svg)?;
        let handle = ctx.load_texture(
            format!("petunia_svg_icon_{id}"),
            image,
            TextureOptions::LINEAR,
        );
        if let Ok(mut cache) = TEXTURE_CACHE.write() {
            cache.insert(key, handle.clone());
        }
        Some(handle)
    }

