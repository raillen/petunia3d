name: modeling-convergence-stack

on:
  push:
    branches:
      - ux/modeling-tool-system-convergence

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/modeling-tool-system-convergence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply modifier, subdivide, performance and SVG patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          def replace_region(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              p.write_text(text[:start] + replacement + text[end:])

          # ------------------------------------------------------------------
          # Persistent non-destructive modifier stack on each Asset.
          project = Path('crates/project/src/lib.rs')
          text = project.read_text()
          marker = '/// Um asset do projeto. `id` nunca muda (rename seguro).\n'
          modifier_defs = r'''/// Non-destructive object modifier evaluated from the immutable base mesh.
#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]
pub enum ModifierKind {
    Mirror {
        axis: usize,
        weld: f32,
    },
    Symmetry {
        axis: usize,
        positive_to_negative: bool,
        weld: f32,
    },
}

#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]
pub struct ModifierInstance {
    pub id: Uuid,
    pub enabled: bool,
    pub kind: ModifierKind,
}

impl ModifierInstance {
    pub fn mirror() -> Self {
        Self {
            id: Uuid::new_v4(),
            enabled: true,
            kind: ModifierKind::Mirror {
                axis: 0,
                weld: 0.001,
            },
        }
    }

    pub fn symmetry() -> Self {
        Self {
            id: Uuid::new_v4(),
            enabled: true,
            kind: ModifierKind::Symmetry {
                axis: 0,
                positive_to_negative: true,
                weld: 0.001,
            },
        }
    }
}

'''
          if modifier_defs not in text:
              text = text.replace(marker, modifier_defs + marker, 1)
          text = text.replace(
              '    pub mesh: Mesh,\n    pub visible: bool,',
              '    pub mesh: Mesh,\n    #[serde(default)]\n    pub modifiers: Vec<ModifierInstance>,\n    pub visible: bool,',
              1,
          )
          text = text.replace(
              '            mesh,\n            visible: true,',
              '            mesh,\n            modifiers: Vec::new(),\n            visible: true,',
              1,
          )
          asset_impl_marker = '''    /// Obtém o material atribuído ao asset a partir do projeto.
    pub fn material<'a>(&self, project: &'a Project) -> Option<&'a Material> {
'''
          evaluated = r'''    /// Evaluates the non-destructive modifier stack without mutating the base mesh.
    pub fn evaluated_mesh(&self) -> Mesh {
        let mut mesh = self.mesh.clone();
        for modifier in &self.modifiers {
            if !modifier.enabled {
                continue;
            }
            match &modifier.kind {
                ModifierKind::Mirror { axis, weld } => mesh.mirror(*axis, *weld),
                ModifierKind::Symmetry {
                    axis,
                    positive_to_negative,
                    weld,
                } => {
                    mesh.symmetrize(*axis, *positive_to_negative, *weld);
                }
            }
        }
        mesh
    }

'''
          if evaluated not in text:
              text = text.replace(asset_impl_marker, evaluated + asset_impl_marker, 1)
          project.write_text(text)

          # Direct test literal in format.rs.
          replace(
              'crates/project/src/format.rs',
              '                mesh: bad_mesh,\n                visible: true,',
              '                mesh: bad_mesh,\n                modifiers: Vec::new(),\n                visible: true,',
              1,
          )

          # Modifiers are no longer registered as destructive toolbar tools.
          replace(
              'crates/module-model/src/lib.rs',
              '        r.register::<MirrorTool>(&enabled);\n',
              '',
              1,
          )
          replace(
              'crates/module-model/src/lib.rs',
              '        r.register::<SymmetrizeTool>(&enabled);\n',
              '',
              1,
          )

          # Real modifier stack UI in the Modifiers tab.
          replace(
              'crates/ui/src/properties_panel.rs',
              'use petunia_project::{AlphaMode, Material, ShaderProfile};',
              'use petunia_project::{AlphaMode, Material, ModifierInstance, ModifierKind, ShaderProfile};',
              1,
          )
          modifier_ui = r'''/// Persistent non-destructive modifier stack for the inspected object.
fn draw_modifiers_section(ui: &mut Ui, state: &mut AppState, force_open: bool) {
    let section_title = state.t("modifiers.title");
    let inspected = inspected_asset_idx(state);
    inspector_widgets::section(
        ui,
        state.ui.density,
        "modifiers",
        inspector_widgets::SectionOpts {
            title: &section_title,
            summary: inspected
                .and_then(|idx| state.project.assets.get(idx))
                .map(|asset| format!("{}", asset.modifiers.len()))
                .as_deref(),
            default_open: true,
            force_open,
        },
        |ui| {
            let Some(idx) = inspected.filter(|idx| *idx < state.project.assets.len()) else {
                ui.label(RichText::new(state.t("empty.no_selection")).color(tokens::TEXT_MUTED));
                return;
            };

            let snapshot = state.project.assets[idx].modifiers.clone();
            if snapshot.is_empty() {
                ui.label(
                    RichText::new(state.t("modifiers.empty"))
                        .size(11.0)
                        .color(tokens::TEXT_MUTED),
                );
            }

            let mut move_up = None;
            let mut move_down = None;
            let mut remove = None;
            for (position, modifier) in snapshot.iter().enumerate() {
                let title = match modifier.kind {
                    ModifierKind::Mirror { .. } => state.t("tools.mirror"),
                    ModifierKind::Symmetry { .. } => state.t("tools.symmetrize"),
                };
                egui::Frame::group(ui.style())
                    .fill(tokens::bg_panel(state))
                    .stroke(tokens::stroke_border_dyn(state))
                    .corner_radius(tokens::RADIUS_CONTROL)
                    .inner_margin(egui::Margin::same(7))
                    .show(ui, |ui| {
                        ui.horizontal(|ui| {
                            let mut enabled = modifier.enabled;
                            if ui.checkbox(&mut enabled, "").changed() {
                                state.checkpoint("toggle modifier");
                                if let Some(item) = state.project.assets[idx].modifiers.get_mut(position) {
                                    item.enabled = enabled;
                                }
                                state.emit_mesh_changed();
                                state.mark_dirty();
                            }
                            ui.label(RichText::new(&title).strong().size(11.5));
                            ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                                if ui.small_button("×").on_hover_text(state.t("ui.delete")).clicked() {
                                    remove = Some(position);
                                }
                                if ui.small_button("↓").on_hover_text(state.t("toolbar.move_down")).clicked() {
                                    move_down = Some(position);
                                }
                                if ui.small_button("↑").on_hover_text(state.t("toolbar.move_up")).clicked() {
                                    move_up = Some(position);
                                }
                            });
                        });
                        ui.separator();

                        match modifier.kind {
                            ModifierKind::Mirror { axis, weld } => {
                                let mut new_axis = axis;
                                ui.horizontal(|ui| {
                                    ui.label("Axis");
                                    for (candidate, label) in [(0usize, "X"), (1, "Y"), (2, "Z")] {
                                        if ui.selectable_label(new_axis == candidate, label).clicked() {
                                            new_axis = candidate;
                                        }
                                    }
                                });
                                let mut new_weld = weld;
                                ui.horizontal(|ui| {
                                    ui.label("Weld");
                                    ui.add(egui::DragValue::new(&mut new_weld).range(0.0..=0.1).speed(0.0005));
                                });
                                if new_axis != axis || (new_weld - weld).abs() > f32::EPSILON {
                                    state.checkpoint("edit mirror modifier");
                                    if let Some(item) = state.project.assets[idx].modifiers.get_mut(position)
                                        && let ModifierKind::Mirror { axis, weld } = &mut item.kind
                                    {
                                        *axis = new_axis;
                                        *weld = new_weld.max(0.0);
                                    }
                                    state.emit_mesh_changed();
                                    state.mark_dirty();
                                }
                            }
                            ModifierKind::Symmetry {
                                axis,
                                positive_to_negative,
                                weld,
                            } => {
                                let mut new_axis = axis;
                                ui.horizontal(|ui| {
                                    ui.label("Axis");
                                    for (candidate, label) in [(0usize, "X"), (1, "Y"), (2, "Z")] {
                                        if ui.selectable_label(new_axis == candidate, label).clicked() {
                                            new_axis = candidate;
                                        }
                                    }
                                });
                                let mut direction = positive_to_negative;
                                ui.horizontal(|ui| {
                                    ui.label("Direction");
                                    ui.selectable_value(&mut direction, true, "+ → −");
                                    ui.selectable_value(&mut direction, false, "− → +");
                                });
                                let mut new_weld = weld;
                                ui.horizontal(|ui| {
                                    ui.label("Weld");
                                    ui.add(egui::DragValue::new(&mut new_weld).range(0.0..=0.1).speed(0.0005));
                                });
                                if new_axis != axis
                                    || direction != positive_to_negative
                                    || (new_weld - weld).abs() > f32::EPSILON
                                {
                                    state.checkpoint("edit symmetry modifier");
                                    if let Some(item) = state.project.assets[idx].modifiers.get_mut(position)
                                        && let ModifierKind::Symmetry {
                                            axis,
                                            positive_to_negative,
                                            weld,
                                        } = &mut item.kind
                                    {
                                        *axis = new_axis;
                                        *positive_to_negative = direction;
                                        *weld = new_weld.max(0.0);
                                    }
                                    state.emit_mesh_changed();
                                    state.mark_dirty();
                                }
                            }
                        }
                    });
                ui.add_space(5.0);
            }

            let len = state.project.assets[idx].modifiers.len();
            if let Some(position) = move_up
                && position > 0
                && position < len
            {
                state.checkpoint("reorder modifier");
                state.project.assets[idx].modifiers.swap(position, position - 1);
                state.emit_mesh_changed();
                state.mark_dirty();
            }
            if let Some(position) = move_down
                && position + 1 < len
            {
                state.checkpoint("reorder modifier");
                state.project.assets[idx].modifiers.swap(position, position + 1);
                state.emit_mesh_changed();
                state.mark_dirty();
            }
            if let Some(position) = remove
                && position < state.project.assets[idx].modifiers.len()
            {
                state.checkpoint("remove modifier");
                state.project.assets[idx].modifiers.remove(position);
                state.emit_mesh_changed();
                state.mark_dirty();
            }

            let add_label = state.t("modifiers.add");
            widgets::PetuniaMenuButton::new(&add_label).show(ui, |ui| {
                if widgets::PetuniaMenuItem::new(&state.t("tools.mirror"))
                    .show(ui)
                    .clicked()
                {
                    state.checkpoint("add mirror modifier");
                    state.project.assets[idx].modifiers.push(ModifierInstance::mirror());
                    state.emit_mesh_changed();
                    state.mark_dirty();
                    ui.close();
                }
                if widgets::PetuniaMenuItem::new(&state.t("tools.symmetrize"))
                    .show(ui)
                    .clicked()
                {
                    state.checkpoint("add symmetry modifier");
                    state.project.assets[idx].modifiers.push(ModifierInstance::symmetry());
                    state.emit_mesh_changed();
                    state.mark_dirty();
                    ui.close();
                }
            });
        },
    );
}

