fn decode_svg_to_alpha_mask(svg: &str) -> Option<ColorImage> {
    let options = resvg::usvg::Options::default();
    let tree = resvg::usvg::Tree::from_str(svg, &options).ok()?;
    let source = tree.size();
    let target = 80u32;
    let mut pixmap = resvg::tiny_skia::Pixmap::new(target, target)?;
    let scale_x = target as f32 / source.width();
    let scale_y = target as f32 / source.height();
    let transform = resvg::tiny_skia::Transform::from_scale(scale_x, scale_y);
    resvg::render(&tree, transform, &mut pixmap.as_mut());
    let pixels = pixmap
        .data()
        .chunks_exact(4)
        .map(|rgba| Color32::from_rgba_unmultiplied(255, 255, 255, rgba[3]))
        .collect();
    Some(ColorImage::new([target as usize, target as usize], pixels))
}

