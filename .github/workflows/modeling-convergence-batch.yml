name: Modeling convergence batch

on:
  push:
    branches: [ux/modeling-tool-system-convergence]

permissions:
  contents: write

jobs:
  converge:
    if: ${{ !contains(github.event.head_commit.message, '[modeling-batch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/modeling-tool-system-convergence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply convergence patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Canonical keymap defaults: T = Universal, G/R/S = individual transforms.
          replace(
              "crates/config/src/keybinds.rs",
              '("model.transform", "G"),\n            ("model.rotate", "R"),\n            ("model.scale", "S"),',
              '("model.transform", "T"),\n            ("model.move", "G"),\n            ("model.rotate", "R"),\n            ("model.scale", "S"),'
          )
          replace(
              "crates/config/src/keybinds.rs",
              '            ("model.mirror", "Ctrl+M"),\n',
              ''
          )

          # Shortcut routing must preserve which transform child was requested.
          replace(
              "crates/app/src/lib.rs",
              '''            "model.transform" => self.set_tool("transform", None),
            "model.rotate" | "model.scale" => {
                self.state.pending_modal = Some(if action == "model.rotate" {
                    petunia_core::modal::ModalKind::Rotate
                } else {
                    petunia_core::modal::ModalKind::Scale
                });
                self.state.active_tool = "transform".into();
                self.state.mark_dirty();
            }
''',
              '''            "model.transform" => self.set_tool("transform", None),
            "model.move" | "model.rotate" | "model.scale" => {
                let (tool_id, kind) = match action.as_str() {
                    "model.move" => ("move", petunia_core::modal::ModalKind::Move),
                    "model.rotate" => ("rotate", petunia_core::modal::ModalKind::Rotate),
                    _ => ("scale", petunia_core::modal::ModalKind::Scale),
                };
                self.state.pending_modal = Some(kind);
                self.state.active_tool = tool_id.into();
                self.state.mark_dirty();
            }
'''
          )
          # Mirror is now a modifier-facing concept; old shortcut path is retired.
          replace(
              "crates/app/src/lib.rs",
              '            "model.mirror" => self.set_tool("mirror", None),\n',
              ''
          )

          # Give native windows a deterministic first-frame size to avoid visible layout settling.
          replace(
              "crates/app/src/lib.rs",
              'create_window(Window::default_attributes().with_title("Petunia3D"))',
              'create_window(\n                    Window::default_attributes()\n                        .with_title("Petunia3D")\n                        .with_inner_size(PhysicalSize::new(1280, 800)),\n                )'
          )
          replace(
              "crates/app/src/lib.rs",
              'Window::default_attributes().with_title("Petunia3D (OpenGL)")',
              'Window::default_attributes()\n                .with_title("Petunia3D (OpenGL)")\n                .with_inner_size(PhysicalSize::new(1280, 800))'
          )

          # Box selection is a selection behavior, not the default drag behavior.
          for needle in [
              'if resp.drag_started_by(egui::PointerButton::Primary)',
              'if resp.dragged_by(egui::PointerButton::Primary)',
              'if resp.drag_stopped_by(egui::PointerButton::Primary)',
