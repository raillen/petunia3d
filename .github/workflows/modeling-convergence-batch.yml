        state.ui.density,
        "modify_tool",
        inspector_widgets::SectionOpts {
            title: &section_title,
            summary: None,
            default_open: true,
            force_open,
        },
        |ui| {
            crate::modules_ui::model_ui::draw_tool_panel(ui, state, &active_id);
        },
    );
}
