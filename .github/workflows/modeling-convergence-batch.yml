          replace("crates/ui/src/properties_panel.rs", marker, replacement)

          # Rename the inspector tab without changing its persisted id.
          replace("assets/locales/en.toml", 'tab_modify = "Modify"', 'tab_modify = "Modifiers"')
          replace("assets/locales/pt-BR.toml", 'tab_modify = "Modificar"', 'tab_modify = "Modificadores"')

          # Narrow known over-wide popovers while preserving usable minimums.
          replace("crates/ui/src/viewport_bar.rs", "ui.set_min_width(210.0);", "ui.set_min_width(168.0);", 1)
          replace("crates/ui/src/viewport_bar.rs", "ui.set_min_width(160.0);", "ui.set_min_width(144.0);", 1)
          replace("crates/ui/src/outliner.rs", "ui.set_min_width(200.0);", "ui.set_min_width(160.0);", 1)
          replace("crates/ui/src/contextual_shelf.rs", "ui.set_min_width(165.0);", "ui.set_min_width(148.0);", 1)

          # Ensure module is exported and render floating tool properties in the viewport.
          replace(
              "crates/ui/src/lib.rs",
              "pub mod tool_fields;\n",
              "pub mod tool_fields;\npub mod tool_properties_popover;\n"
          )
          replace(
              "crates/ui/src/lib.rs",
              '''        primitive_card::draw_primitive_card(ui, state, rect);
        let pointer_on_shelf =''',
              '''        primitive_card::draw_primitive_card(ui, state, rect);
        tool_properties_popover::draw(ui, state, rect);
        let pointer_on_shelf ='''
          )
          PY

          cat > crates/ui/src/tool_properties_popover.rs <<'RS'
          //! Floating Tool Properties owned by the viewport, not the Object Inspector.
          //!
          //! This is the transitional convergence boundary: interactive modal tools
          //! use the canonical `tool_fields`, while non-modal modeling tools reuse
          //! their existing controls in a viewport-local card until every tool has
          //! a descriptor-backed session.

          use egui::{Align2, RichText, Ui, Vec2};
          use petunia_core::{AppState, Workspace};

          pub fn draw(ui: &mut Ui, state: &mut AppState, viewport: egui::Rect) {
              if state.workspace != Workspace::Model || state.is_active_locked() {
                  return;
              }
              let active = state.active_tool.clone();
              let show = state.modal.is_some()
                  || state.pending_modal.is_some()
                  || matches!(
                      active.as_str(),
                      "primitives"
                          | "extrude"
                          | "inset"
                          | "bevel"
                          | "pushpull"
                          | "slice"
                          | "subdivide"
                          | "draw_profile"
                          | "merge"
                          | "connect"
                          | "dissolve"
                          | "revolve"
                  );
              if !show {
                  return;
              }

              let title = state
                  .modal
                  .as_ref()
                  .map(|modal| modal.kind.label().to_string())
                  .unwrap_or_else(|| {
                      let translated = state.t(&format!("tools.{active}"));
                      if translated == format!("tools.{active}") {
                          active.clone()
                      } else {
                          translated
                      }
                  });

              let pos = viewport.left_top() + Vec2::new(18.0, 18.0);
              egui::Area::new(egui::Id::new("viewport.tool_properties"))
                  .order(egui::Order::Foreground)
                  .fixed_pos(pos)
                  .pivot(Align2::LEFT_TOP)
                  .show(ui.ctx(), |ui| {
                      egui::Frame::popup(ui.style()).show(ui, |ui| {
                          ui.set_min_width(220.0);
                          ui.set_max_width(286.0);
                          ui.label(RichText::new(&title).strong().size(12.0));
                          ui.separator();

                          if state.modal.is_some() {
                              crate::tool_fields::draw(ui, state);
                              ui.separator();
                              ui.horizontal(|ui| {
                                  if ui.button(state.t("actions.apply")).clicked() {
                                      state.commit_modal();
                                  }
                                  if ui.button(state.t("actions.cancel")).clicked() {
                                      state.cancel_modal();
                                  }
                              });
                          } else {
                              crate::modules_ui::model_ui::draw_tool_panel(ui, state, &active);
                          }
                      });
                  });
          }
          RS

          cargo fmt --all
          rm .github/workflows/modeling-convergence-batch.yml
      - name: Check workspace
        run: cargo check --workspace
      - name: Run focused tests
        run: |
          cargo test -p petunia_ui --lib
          cargo test -p petunia_core --lib
          cargo test -p petunia_config --lib
      - name: Commit validated batch
        shell: bash
        run: |
          git config user.name "Petunia3D Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: converge modeling tool workflows [modeling-batch]"
          git push origin HEAD:ux/modeling-tool-system-convergence
