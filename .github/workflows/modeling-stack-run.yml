name: modeling-convergence-implementation

on:
  push:
    branches:
      - ux/modeling-tool-system-convergence

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/modeling-tool-system-convergence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply modeling convergence implementation
        run: |
          python3 scripts/apply_modeling_convergence.py
          python3 scripts/fix_modeling_convergence.py
      - name: Format
        run: cargo fmt --all
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check domain and core
        run: |
          cargo check -p petunia_project
          cargo check -p petunia_core
          cargo check -p petunia_config
      - name: Check renderers
        run: |
          cargo check -p petunia_render_wgpu
          cargo check -p petunia_render_gl
      - name: Check UI and app
        run: |
          cargo check -p petunia_ui
          cargo check -p petunia_app
      - name: Refresh intentional persistence snapshot
        run: INSTA_UPDATE=always cargo test -p petunia_project --test save_tree save_creates_exact_tree
      - name: Focused tests
        run: |
          cargo test -p petunia_project
          cargo test -p petunia_core --lib
          cargo test -p petunia_config --lib
          cargo test -p petunia_ui --lib
      - name: Remove staging automation
        run: |
          rm -f scripts/apply_modeling_convergence.py
          rm -f scripts/fix_modeling_convergence.py
          rm -f .github/workflows/modeling-convergence-stack.yml
          rm -f .github/workflows/modeling-stack-run.yml
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: converge modeling tools, modifiers and SVG UI [skip ci]'
          git push origin HEAD:ux/modeling-tool-system-convergence
