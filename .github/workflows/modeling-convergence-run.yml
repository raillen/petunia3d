name: modeling-convergence-run

on:
  push:
    branches:
      - ux/modeling-tool-system-convergence

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/modeling-tool-system-convergence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Execute staged convergence patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/modeling-convergence-batch.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Apply convergence patches')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - name: Check workspace'))
          lines = src[run_line + 1:end]
          # The YAML block has ten spaces of indentation.
          shell = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/modeling-batch.sh').write_text(shell)
          PY
          bash /tmp/modeling-batch.sh
          rm -f .github/workflows/modeling-convergence-run.yml
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check config
        run: cargo check -p petunia_config
      - name: Check UI
        run: cargo check -p petunia_ui
      - name: Check app
        run: cargo check -p petunia_app
      - name: Focused tests
        run: |
          cargo test -p petunia_config
          cargo test -p petunia_ui --lib
          cargo test -p petunia_core --lib
      - name: Commit validated convergence batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: converge modeling tool workflows [skip ci]'
          git push origin HEAD:ux/modeling-tool-system-convergence
