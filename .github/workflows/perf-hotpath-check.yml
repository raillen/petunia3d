name: perf-hotpath-check

on:
  push:
    branches:
      - fix/ui-hot-path-performance

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check config
        run: cargo check -p petunia_config
      - name: Check UI
        run: cargo check -p petunia_ui
      - name: Check app
        run: cargo check -p petunia_app
      - name: Config tests
        run: cargo test -p petunia_config
      - name: UI tests
        run: cargo test -p petunia_ui --lib
