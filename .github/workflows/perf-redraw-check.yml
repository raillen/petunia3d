name: perf-redraw-check

on:
  push:
    branches:
      - fix/ui-hot-path-performance

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-hot-path-performance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Remove redundant unconditional cursor redraws
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/app/src/lib.rs')
          text = path.read_text()

          wgpu_pattern = re.compile(
              r'(WindowEvent::CursorMoved\s*\{\s*position,\s*\.\.\s*\}\s*=>\s*\{\s*\n'
              r'\s*self\.core\.last_mouse\s*=\s*Some\(\(position\.x,\s*position\.y\)\);\s*\n)'
              r'\s*gfx\.window\.request_redraw\(\);\s*\n(\s*\})'
          )
          gl_pattern = re.compile(
              r'(WindowEvent::CursorMoved\s*\{\s*position,\s*\.\.\s*\}\s*=>\s*\{\s*\n'
              r'\s*self\.core\.last_mouse\s*=\s*Some\(\(position\.x,\s*position\.y\)\);\s*\n)'
              r'\s*g\.gl_window\.window\(\)\.request_redraw\(\);\s*\n(\s*\})'
          )

          text, wgpu_count = wgpu_pattern.subn(
              r'''            WindowEvent::CursorMoved { position, .. } => {
                // egui-winit already reports whether pointer movement needs repaint.
                // Avoid a second unconditional full 3D + UI frame on every event.
                self.core.last_mouse = Some((position.x, position.y));
            }''',
              text,
              count=1,
          )
          text, gl_count = gl_pattern.subn(
              r'''            WindowEvent::CursorMoved { position, .. } => {
                // Same policy as WGPU: egui decides whether pointer movement needs
                // repaint, avoiding an unconditional full render on every event.
                self.core.last_mouse = Some((position.x, position.y));
            }''',
              text,
              count=1,
          )
          if (wgpu_count, gl_count) != (1, 1):
              raise SystemExit(f'expected one WGPU and one GL block, got {wgpu_count=} {gl_count=}')
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Persist redraw fix
        run: |
          if ! git diff --quiet -- crates/app/src/lib.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/app/src/lib.rs
            git commit -m 'perf(app): avoid redundant cursor-move redraws [skip ci]'
            git push origin HEAD:fix/ui-hot-path-performance
          fi
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check config
        run: cargo check -p petunia_config
      - name: Check UI
        run: cargo check -p petunia_ui
      - name: Check app
        run: cargo check -p petunia_app
      - name: Config tests
        run: cargo test -p petunia_config
      - name: UI tests
        run: cargo test -p petunia_ui --lib
