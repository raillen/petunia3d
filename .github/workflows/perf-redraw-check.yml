name: perf-redraw-check

on:
  push:
    branches:
      - fix/ui-hot-path-performance

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-hot-path-performance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Remove redundant unconditional cursor redraws
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/app/src/lib.rs')
          text = path.read_text()
          old_wgpu = '''            WindowEvent::CursorMoved { position, .. } => {
                self.core.last_mouse = Some((position.x, position.y));
                gfx.window.request_redraw();
            }'''
          new_wgpu = '''            WindowEvent::CursorMoved { position, .. } => {
                // `egui_state.on_window_event` already requests a redraw when pointer
                // movement changes hover/interaction state. Do not force a second,
                // unconditional full 3D + UI frame for every cursor event.
                self.core.last_mouse = Some((position.x, position.y));
            }'''
          old_gl = '''            WindowEvent::CursorMoved { position, .. } => {
                self.core.last_mouse = Some((position.x, position.y));
                g.gl_window.window().request_redraw();
            }'''
          new_gl = '''            WindowEvent::CursorMoved { position, .. } => {
                // Same policy as WGPU: egui decides whether pointer movement needs
                // repaint; avoid an unconditional full render on every event.
                self.core.last_mouse = Some((position.x, position.y));
            }'''
          if old_wgpu not in text or old_gl not in text:
              raise SystemExit('expected CursorMoved blocks were not found')
          text = text.replace(old_wgpu, new_wgpu, 1).replace(old_gl, new_gl, 1)
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Persist redraw fix
        run: |
          if ! git diff --quiet -- crates/app/src/lib.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/app/src/lib.rs
            git commit -m 'perf(app): avoid redundant cursor-move redraws [skip ci]'
            git push origin HEAD:fix/ui-hot-path-performance
          fi
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check config
        run: cargo check -p petunia_config
      - name: Check UI
        run: cargo check -p petunia_ui
      - name: Check app
        run: cargo check -p petunia_app
      - name: Config tests
        run: cargo test -p petunia_config
      - name: UI tests
        run: cargo test -p petunia_ui --lib
